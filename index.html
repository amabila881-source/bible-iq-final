<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible IQ 100 Timer+Sound</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:10px;min-height:100vh}.card{background:#1e293b;width:100%;max-width:520px;border-radius:20px;padding:18px}.lev{display:flex;gap:6px;margin:8px 0}.lev button{flex:1;padding:7px;border:0;border-radius:8px;font-weight:700}.active{outline:2px solid #fff}.meta{display:flex;justify-content:space-between;color:#94a3b8;font-size:12px;margin:6px 0}.bar{height:10px;background:#334155;border-radius:10px;overflow:hidden;display:flex;margin:6px 0}.fill{height:100%;background:#22c55e;width:100%}.timerBar{height:100%;background:#fbbf24;width:100%;transition:width 1s linear}.diff{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}.easy{background:#22c55e;color:#000}.medium{background:#f59e0b;color:#000}.hard{background:#ef4444;color:#fff}.q{font-size:18px;font-weight:800;margin:12px 0;min-height:40px}.opt{width:100%;padding:13px;margin:6px 0;background:#334155;color:#fff;border:2px solid transparent;border-radius:10px;text-align:left;font-size:15px}.opt.correct{background:#22c55e!important;color:#000}.opt.wrong{background:#ef4444!important}.exp{background:#0f172a;border-left:4px solid #fbbf24;padding:10px;border-radius:6px;margin-top:10px;display:none;font-size:13px}.btn{width:100%;padding:13px;background:#fbbf24;color:#000;border:0;border-radius:10px;font-weight:800;margin-top:10px;display:none}.time-circle{width:42px;height:42px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:2px solid #fbbf24}</style></head><body><div class="card"><h1 style="color:#fbbf24;text-align:center;margin:0 0 8px">📖 Bible IQ - 100 Qs</h1><div class="lev"><button id="b-all" class="active" onclick="setLev('all')" style= let qs=[...ALL],i=0,s=0,lock=false,t=15,timer=null,aud=null;
function initAud(){if(!aud)aud=new(window.AudioContext||window.webkitAudioContext)();}
function beep(f,d,v,tp){initAud();let o=aud.createOscillator(),g=aud.createGain();o.type=tp||'sine';o.frequency.value=f;o.connect(g);g.connect(aud.destination);g.gain.value=v||0.3;o.start();g.gain.exponentialRampToValueAtTime(0.01,aud.currentTime+d);o.stop(aud.currentTime+d);}
function soundCorrect(){beep(523,0.2,0.3);setTimeout(()=>beep(659,0.2,0.3),150);setTimeout(()=>beep(784,0.4,0.3),300);}
function soundWrong(){beep(150,0.6,0.4,'sawtooth');}
function soundTick(){beep(900,0.1,0.15);}
function soundTimeUp(){beep(80,0.8,0.4,'square');}

function startTimer(){clearInterval(timer);t=15;let tc=document.getElementById('timerCircle');let tm=document.getElementById('tm');tc.innerText=t;tm.style.width='100%';tm.style.background='#22c55e';tc.style.color='#fff';tc.style.borderColor='#fbbf24';timer=setInterval(()=>{t--;tc.innerText=t;tm.style.width=(t/15*100)+'%';if(t<=5){tm.style.background='#ef4444';tc.style.color='#ef4444';tc.style.borderColor='#ef4444';if(t>0)soundTick();}if(t<=0){clearInterval(timer);timeUp();}},1000);}
function timeUp(){if(lock)return;lock=true;soundTimeUp();let c=qs[i];let btns=document.querySelectorAll('.opt');btns[c[5]].classList.add('correct');let ex=document.getElementById('ex');ex.innerHTML=`<b>⏰ Time Up! Answer: ${c[c[5]+1]}</b><br>${c[6]}`;ex.style.display='block';document.getElementById('nx').style.display='block';}
function load(){if(i>=qs.length){clearInterval(timer);document.getElementById('qq').style.display='none';document.getElementById('oo').style.display='none';document.getElementById('ex').style.display='none';document.getElementById('nx').style.display='none';document.getElementById('end').style.display='block';document.getElementById('fin').innerText=`Final ${s}/${qs.length}`;document.getElementById('det').innerText=(s/qs.length>0.8?'🏆 Bible Genius!':s/qs.length>0.5?'👏 Great Faith!':'📖 Keep Studying!');document.getElementById('fl').style.width='100%';return;}lock=false;let c=qs[i];document.getElementById('sc').innerText=`Score:${s}`;document.getElementById('ct').innerText=`${i+1}/${qs.length}`;let db=document.getElementById('db');db.innerText=c[7];db.className='diff '+(c[7]==='Easy'?'easy':c[7]==='Medium'?'medium':'hard');document.getElementById('fl').style.width=`${(i/qs.length)*100}%`;document.getElementById('qq').innerText=(i+1)+". "+c[0];let oo=document.getElementById('oo');oo.innerHTML='';for(let k=1;k<=4;k++){let b=document.createElement('button');b.className='opt';b.innerText=c[k];b.onclick=()=>check(k-1,b);oo.appendChild(b);}document.getElementById('ex').style.display='none';document.getElementById('nx').style.display='none';startTimer();}
function check(idx,btn){if(lock)return;lock=true;clearInterval(timer);initAud();let c=qs[i];let btns=document.querySelectorAll('.opt');if(idx===c[5]){btn.classList.add('correct');s++;soundCorrect();}else{btn.classList.add('wrong');btns[c[5]].classList.add('correct');soundWrong();}document.getElementById('sc').innerText=`Score:${s}`;let ex=document.getElementById('ex');ex.innerHTML=`<b>${idx===c[5]?'✅ Correct!':'❌ Wrong! Answer: '+c[c[5]+1]}</b><br>${c[6]}`;ex.style.display='block';document.getElementById('nx').style.display='block';}
function nextQ(){i++;load();}
load();
